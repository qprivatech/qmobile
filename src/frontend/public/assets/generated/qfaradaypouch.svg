<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121225;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#0a0a14"/>

  <!-- Grid pattern -->
  <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3e" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="600" fill="url(#grid2)"/>

  <!-- Signal waves (blocked) -->
  <g opacity="0.12" stroke="#ef4444" stroke-width="2" fill="none">
    <path d="M 420 120 Q 480 180 420 240"/>
    <path d="M 440 100 Q 520 180 440 260"/>
  </g>

  <!-- Crossed out WiFi -->
  <g opacity="0.25">
    <path d="M 450 160 Q 470 140 490 160" stroke="#ef4444" stroke-width="2" fill="none"/>
    <path d="M 440 150 Q 470 120 500 150" stroke="#ef4444" stroke-width="2" fill="none"/>
    <line x1="435" y1="145" x2="505" y2="215" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Faraday Pouch Body -->
  <path d="M 220 180 L 380 180 L 390 420 Q 395 440 380 450 L 220 450 Q 205 440 210 420 Z" fill="url(#pouchGrad)" stroke="#2a2a5e" stroke-width="2"/>

  <!-- Pouch fold/top -->
  <path d="M 215 180 L 385 180 L 380 140 Q 375 130 300 130 Q 225 130 220 140 Z" fill="#252550" stroke="#3a3a6e" stroke-width="1.5"/>

  <!-- Fold line -->
  <line x1="212" y1="180" x2="388" y2="180" stroke="#3a3a6e" stroke-width="1"/>

  <!-- Velcro/seal line -->
  <rect x="230" y="155" width="140" height="8" rx="2" fill="#3a3a6e" opacity="0.8"/>
  <line x1="230" y1="159" x2="370" y2="159" stroke="#4a4a8e" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Shield icon on pouch -->
  <path d="M 300 240 L 325 255 L 325 285 Q 325 305 300 320 Q 275 305 275 285 L 275 255 Z" fill="url(#accentGrad)" opacity="0.9"/>
  <path d="M 288 280 L 296 288 L 312 270" stroke="#0a0a14" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signal blocking indicator -->
  <g stroke="#60a5fa" stroke-width="1.5" opacity="0.5">
    <line x1="240" y1="360" x2="255" y2="360"/>
    <line x1="265" y1="360" x2="280" y2="360"/>
    <line x1="320" y1="360" x2="335" y2="360"/>
    <line x1="345" y1="360" x2="360" y2="360"/>
  </g>

  <!-- Phone silhouette inside pouch (faint) -->
  <rect x="275" y="260" width="50" height="90" rx="6" fill="#151530" stroke="#252550" stroke-width="1" opacity="0.5"/>
  <rect x="283" y="270" width="34" height="65" rx="3" fill="#0f0f25" opacity="0.7"/>

  <!-- Side stitching detail -->
  <g stroke="#3a3a6e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="225" y1="200" x2="215" y2="410"/>
    <line x1="375" y1="200" x2="385" y2="410"/>
  </g>

  <!-- Bottom label -->
  <rect x="255" y="400" width="90" height="18" rx="3" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1"/>
  <text x="300" y="412" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="8" letter-spacing="1">TITANRF</text>

  <!-- Corner accents -->
  <g stroke="#60a5fa" stroke-width="1.5" opacity="0.5">
    <line x1="220" y1="200" x2="220" y2="215"/>
    <line x1="220" y1="200" x2="235" y2="200"/>
    <line x1="380" y1="200" x2="380" y2="215"/>
    <line x1="380" y1="200" x2="365" y2="200"/>
  </g>

  <!-- Text label -->
  <text x="300" y="500" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="1">Q Faraday Pouch</text>
  <text x="300" y="525" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">Portable Signal Shielding</text>
</svg>