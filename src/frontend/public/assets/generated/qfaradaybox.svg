<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#0a0a14"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3e" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- Signal waves (blocked) -->
  <g opacity="0.15" stroke="#ef4444" stroke-width="2" fill="none">
    <path d="M 80 150 Q 150 80 220 150"/>
    <path d="M 60 170 Q 150 60 240 170"/>
    <path d="M 40 190 Q 150 40 260 190"/>
  </g>

  <!-- Crossed out signal -->
  <g opacity="0.3">
    <circle cx="150" cy="150" r="30" stroke="#ef4444" stroke-width="3" fill="none"/>
    <line x1="125" y1="125" x2="175" y2="175" stroke="#ef4444" stroke-width="3"/>
  </g>

  <!-- Faraday Box Body -->
  <rect x="180" y="200" width="240" height="200" rx="12" fill="url(#boxGrad)" stroke="#2a2a5e" stroke-width="2"/>

  <!-- Box lid/top -->
  <rect x="175" y="190" width="250" height="25" rx="8" fill="url(#lidGrad)" stroke="#3a3a6e" stroke-width="1.5"/>

  <!-- Lid seam line -->
  <line x1="180" y1="215" x2="420" y2="215" stroke="#3a3a6e" stroke-width="1"/>

  <!-- Lock/latch on lid -->
  <rect x="285" y="195" width="30" height="15" rx="3" fill="#4a4a7e" stroke="#5a5a8e" stroke-width="1"/>
  <circle cx="300" cy="202" r="4" fill="#22c55e" filter="url(#glow)"/>

  <!-- Shield icon on box front -->
  <path d="M 300 250 L 330 265 L 330 295 Q 330 315 300 330 Q 270 315 270 295 L 270 265 Z" fill="url(#shieldGrad)" opacity="0.9"/>
  <path d="M 285 285 L 295 295 L 315 275" stroke="#0a0a14" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signal blocking lines on box -->
  <g stroke="#4ade80" stroke-width="1.5" opacity="0.4">
    <line x1="200" y1="350" x2="220" y2="350"/>
    <line x1="230" y1="350" x2="250" y2="350"/>
    <line x1="260" y1="350" x2="280" y2="350"/>
    <line x1="320" y1="350" x2="340" y2="350"/>
    <line x1="350" y1="350" x2="370" y2="350"/>
    <line x1="380" y1="350" x2="400" y2="350"/>
  </g>

  <!-- Phone silhouette inside (faint) -->
  <rect x="270" y="260" width="60" height="100" rx="8" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1" opacity="0.6"/>
  <rect x="280" y="270" width="40" height="70" rx="4" fill="#0f0f2a" opacity="0.8"/>

  <!-- Bottom label -->
  <rect x="240" y="380" width="120" height="20" rx="4" fill="#1a1a3e" stroke="#2a2a5e" stroke-width="1"/>
  <text x="300" y="394" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="10" letter-spacing="2">FARADAY BOX</text>

  <!-- Corner accents -->
  <g stroke="#4ade80" stroke-width="2" opacity="0.6">
    <line x1="180" y1="220" x2="180" y2="235"/>
    <line x1="180" y1="220" x2="195" y2="220"/>
    <line x1="420" y1="220" x2="420" y2="235"/>
    <line x1="420" y1="220" x2="405" y2="220"/>
    <line x1="180" y1="380" x2="180" y2="395"/>
    <line x1="180" y1="395" x2="195" y2="395"/>
    <line x1="420" y1="380" x2="420" y2="395"/>
    <line x1="420" y1="395" x2="405" y2="395"/>
  </g>

  <!-- Text label -->
  <text x="300" y="460" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="1">Q Faraday Box</text>
  <text x="300" y="485" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">RF Signal Isolation</text>
</svg>